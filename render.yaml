services:
  - type: web
    name: qinbox-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    disk:
      name: qinbox-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: QINBOX_DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: QINBOX_SESSION_SECRET
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: QINBOX_ACTIVATION_CODE
        sync: false
